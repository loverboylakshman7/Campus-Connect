<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusConnect | Login</title>


    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- Global CSS -->

    <link rel="stylesheet"
          href="css/main.css">


    <!-- Login CSS -->

    <link rel="stylesheet"
          href="css/login.css">

</head>


<body class="login-page">


    <!-- ================================
         LOGIN CONTAINER
    ================================= -->

    <main class="login-container">


        <!-- BRAND -->

        <div class="login-brand">

            <h1>
                Campus<span>Connect</span>
            </h1>

            <p>
                College Companion
            </p>

        </div>


        <!-- WELCOME -->

        <div class="login-heading">

            <h2>
                Welcome Back
            </h2>

            <p>
                Sign in to continue to your campus dashboard.
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form
            id="loginForm"
            class="login-form">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>


                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>


                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password">

                        <i class="fa-regular fa-eye"></i>

                    </button>

                </div>

            </div>


            <!-- OPTIONS -->

            <div class="login-options">


                <label class="remember-me">

                    <input
                        type="checkbox"
                        id="rememberMe">

                    <span>
                        Remember me
                    </span>

                </label>


                <a
                    href="#"
                    class="forgot-password">

                    Forgot Password?

                </a>


            </div>


            <!-- ERROR -->

            <div
                class="login-error"
                id="loginError">

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button">

                <span>
                    Login
                </span>

                <i class="fa-solid fa-arrow-right"></i>

            </button>


        </form>


        <!-- DEMO LOGIN -->

        <div class="demo-login">

            <h4>
                Demo Login
            </h4>

            <p>
                student@campusconnect.com
            </p>

            <p>
                Password: 123456
            </p>

        </div>


    </main>


    <!-- FOOTER -->

    <footer class="login-footer">

        © 2026 CampusConnect
        <span>•</span>
        College Companion

    </footer>


    <!-- JAVASCRIPT -->

    <script src="js/login.js"></script>

</body>

</html>
